# Every push to main is what Anthropic's plugin directory scans and, once the
# plugin is approved, can publish automatically. This keeps a broken commit from
# getting that far: the same offline gauntlet as CLAUDE.md, no live sources.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp/ua-legal-sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/ua-legal-sources/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # The plugin ships a committed bundle; a source change without a rebuild
      # would pass every other check while users run the old code.
      - name: Bundle matches the source
        run: |
          npm run build
          git diff --exit-code -- ../../plugins/ua-case-assistant/mcp/ua-legal-sources.mjs
      - run: npm run check-config
      - run: npm run check-protocol
      # Also enforces the directory's rules: only ${CLAUDE_PLUGIN_ROOT} in the
      # server config, no file over 256 KiB, no whole-env read, one version.
      - run: npm run check-plugin
      - name: Strict plugin and marketplace validation
        working-directory: .
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.296 plugin validate --strict ./plugins/ua-case-assistant
          npx --yes @anthropic-ai/claude-code@2.1.296 plugin validate --strict .
